version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errname
    - errorlint
    - exhaustive
    - gocritic
    - godot
    - gosec
    - intrange
    - misspell
    - nilerr
    - nolintlint
    - perfsprint
    - revive
    - testifylint
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # struct field order follows the protocol, not memory layout
    misspell:
      locale: UK
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-naming
        - name: error-strings
        - name: errorf
        - name: receiver-naming
        - name: indent-error-flow
        - name: unused-parameter
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
