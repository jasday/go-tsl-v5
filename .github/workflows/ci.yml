name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - run: go test -race -cover ./...
      - name: Fuzz
        run: |
          go test -run='^$' -fuzz='^FuzzUnmarshal$' -fuzztime=30s .
          go test -run='^$' -fuzz='^FuzzDecoder$' -fuzztime=30s .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14

  line-endings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check files use LF line endings
        run: |
          bad=$(git ls-files --eol | awk '$1 ~ /crlf|mixed/ {print $NF}')
          if [ -n "$bad" ]; then
            echo "Files with CRLF line endings:"
            echo "$bad"
            exit 1
          fi

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
